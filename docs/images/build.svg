<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570"><rect width="1000" height="570" rx="20" fill="#101820"/><g font-family="Arial, sans-serif"><text x="940" y="55" text-anchor="end" fill="#79b8d5" font-size="30">Windows — من المصدر إلى نسخة محمولة</text><rect x="40" y="95" width="920" height="90" rx="12" fill="#192c3c"/><circle cx="910" cy="138" r="25" fill="#79b8d5"/><text x="910" y="147" text-anchor="middle" font-size="25" fill="#101820">1</text><text x="855" y="130" text-anchor="end" fill="white" font-size="24">Start_Windows.bat</text><text x="855" y="163" text-anchor="end" fill="#c3d2df" font-size="21">شغّل التطبيق من المصدر واختبر الكاميرا</text><rect x="40" y="205" width="920" height="90" rx="12" fill="#192c3c"/><circle cx="910" cy="248" r="25" fill="#79b8d5"/><text x="910" y="257" text-anchor="middle" font-size="25" fill="#101820">2</text><text x="855" y="240" text-anchor="end" fill="white" font-size="24">Build_EXE.bat</text><text x="855" y="273" text-anchor="end" fill="#c3d2df" font-size="21">تثبيت الاعتماديات والاختبارات وتجميع البرنامج</text><rect x="40" y="315" width="920" height="90" rx="12" fill="#192c3c"/><circle cx="910" cy="358" r="25" fill="#79b8d5"/><text x="910" y="367" text-anchor="middle" font-size="25" fill="#101820">3</text><text x="855" y="350" text-anchor="end" fill="white" font-size="24">dist/TutMagic/TutMagic.exe</text><text x="855" y="383" text-anchor="end" fill="#c3d2df" font-size="21">اختبر الملف التنفيذي مع باقي ملفات المجلد</text><rect x="40" y="425" width="920" height="90" rx="12" fill="#192c3c"/><circle cx="910" cy="468" r="25" fill="#79b8d5"/><text x="910" y="477" text-anchor="middle" font-size="25" fill="#101820">4</text><text x="855" y="460" text-anchor="end" fill="white" font-size="24">Package_Windows.bat → TutMagic_Portable.zip</text><text x="855" y="493" text-anchor="end" fill="#c3d2df" font-size="21">اختبر الحزمة على جهاز آخر قبل توزيعها</text></g></svg>